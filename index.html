<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serbian air Maps</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    overflow:hidden;
}

/* Header */

.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:70px;

    background:rgba(255,255,255,0.95);
    backdrop-filter:blur(10px);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 25px;

    z-index:999;

    box-shadow:0 2px 15px rgba(0,0,0,0.15);
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#1a73e8;
}

.info{
    color:#444;
    font-size:14px;
}

/* Mapa */

.map-container{
    width:100%;
    height:100vh;
}

.map-container iframe{
    width:100%;
    height:100%;
    border:none;
}

</style>
</head>
<body>

<div class="header">
    <div class="logo">Serbian air Maps</div>
    <div class="info">Interactive Serbia Map</div>
</div>

<div class="map-container">
    <iframe
        src="<iframe width="768" height="576" src="https://maphub.net/embed_h/TanlCJtqh8yahfsT?button=0" frameborder="0"></iframe>"
        allowfullscreen
        loading="lazy">
    </iframe>
</div>

</body>
</html>
