<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Serbian Maps</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#map{
    width:100%;
    height:100%;
}

.topbar{
    position:absolute;
    top:10px;
    left:10px;
    z-index:1000;
    background:white;
    padding:10px 15px;
    border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.2);
    font-weight:bold;
}
</style>
</head>
<body>

<div class="topbar">Serbian Maps</div>

<div id="map"></div>

<script>
function initMap(){

    const serbiaBounds = {
        north:46.3,
        south:42.1,
        west:18.8,
        east:23.1
    };

    const map = new google.maps.Map(document.getElementById("map"),{
        center:{lat:44.0165,lng:20.9114},
        zoom:7,

        zoomControl:true,
        streetViewControl:false,
        fullscreenControl:true,
        mapTypeControl:true,

        gestureHandling:"greedy",

        restriction:{
            latLngBounds:serbiaBounds
        }
    });

}
</script>

<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDyPVrDne7sF7DDDTmEmfrK9gm_jTjXsVU&callback=initMap">
</script>

</body>
</html>
