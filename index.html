<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Serbian air Maps</title>

<style>

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#map{
    width:100%;
    height:100vh;
}

.topbar{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:55px;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(6px);
    z-index:10;
    display:flex;
    align-items:center;
    padding-left:20px;
    font-weight:bold;
    font-size:18px;
}

</style>
</head>

<body>

<div class="topbar">
    Serbian Maps
</div>

<div id="map"></div>

<script>

function initMap(){

    const serbiaBounds = {
        north:46.3,
        south:42.1,
        west:18.8,
        east:23.1
    };

    const map = new google.maps.Map(document.getElementById("map"),{

        center:{
            lat:44.0165,
            lng:20.9114
        },

        zoom:7,

        minZoom:6,
        maxZoom:12,

        restriction:{
            latLngBounds:serbiaBounds,
            strictBounds:true
        },

        streetViewControl:false,
        fullscreenControl:false,
        mapTypeControl:false

    });

    /* GOOGLE MY MAPS LAYER */

    const kmlLayer = new google.maps.KmlLayer({
        url:"https://www.google.com/maps/d/kml?mid=12lpsWraaDL0jSf0_tM0QsnwFBopoDK0",
        map:map,
        preserveViewport:true
    });

}

/* disable right click */

document.addEventListener("contextmenu",e=>e.preventDefault());

</script>

<!-- UBACI API KEY -->

<script async defer
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDyPVrDne7sF7DDDTmEmfrK9gm_jTjXsVU&callback=initMap">
</script>

</body>
</html>
